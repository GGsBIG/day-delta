name: DayDelta
options:
  bundleIdPrefix: com.tcsxft.daydelta
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set this to your Apple ID personal team id (Xcode > Settings > Accounts),
    # or leave blank and set the team in Xcode's Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
targets:
  DayDelta:
    type: application
    platform: iOS
    sources:
      - Shared
      - DayDelta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tcsxft.daydelta.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: DayDelta
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: DayDeltaWidget
  DayDeltaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - DayDeltaWidget
    info:
      path: DayDeltaWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tcsxft.daydelta.app.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: DayDelta
