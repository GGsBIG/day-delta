name: DayDelta
options:
  bundleIdPrefix: com.tcsxft.daydelta
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Apple ID personal team id (Xcode > Settings > Accounts). Both the app and
    # widget targets inherit this, so signing works without per-target setup.
    DEVELOPMENT_TEAM: "3U6A2QM3YT"
targets:
  DayDelta:
    type: application
    platform: iOS
    sources:
      - Shared
      - DayDelta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tcsxft.daydelta.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: DayDelta
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        # Allow ProMotion 120Hz for the app's animations (otherwise capped at 60).
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock DayDelta with Face ID.
    dependencies:
      - target: DayDeltaWidget
  DayDeltaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - DayDeltaWidget
    info:
      path: DayDeltaWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tcsxft.daydelta.app.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: DayDelta
